# Taza-Gojo EDU — single fly.io app.
# One machine runs everything: Django (daphne) on 8000 serves the API, the
# WebSocket signaling relay AND the built React SPA from a single origin.
# Secrets/env not committed: DJANGO_SECRET_KEY, DJANGO_DEBUG,
# DJANGO_ALLOWED_HOSTS and DATABASE_URL live in `fly secrets set`.

app = "taza-gojo-edu"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Web app talks to the same origin (it is served by this container);
  # native builds hardcode VITE_API_URL at build time instead.
  AI_PROVIDER = "mock"
  AI_API_KEY = ""
  # Leave TURN_SERVERS unset unless you run a TURN relay. The API always
  # falls back to public STUN, so calls work without it.
  # Single container -> in-memory Channels works. For 2+ instances set
  # REDIS_URL to an Upstash/fly Redis instance (see docs/DEPLOY.md).

[services]
  # health checks hit the API, not the SPA catch-all
  processes = ["app"]
  internal_port = 8000
  auto_start_machines = true
  auto_stop_machines = "stop"
  # Keep one machine hot so a live-tutoring call never waits ~25s for a
  # cold boot (WebRTC signaling must connect immediately).
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  # Watch /api/health/ (no DB/auth) — if the machine wedges (as CPU/memory
  # starvation caused before) fly restarts it automatically instead of serving
  # hung requests until someone SSHes in to reboot.
  [[services.http_checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "25s"
    method = "get"
    path = "/api/health/"
    restart_limit = 2
    restart_interval = "2m"